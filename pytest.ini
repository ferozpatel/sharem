[pytest]
# Delta Exchange trading bot test configuration.
# Tests live in tests/; property-based tests use hypothesis (min 100 examples)
# and are tagged: # Feature: delta-exchange-trading-bot, Property N: ...
# All REST/WebSocket transport is mocked so no network call occurs.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
